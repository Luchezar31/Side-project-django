{% extends 'common/base.html' %}

{% block content %}
    <h1 style="color: #405cf5;">Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form }}
        <button class="button-9">Submit</button>
        <div class="mt-3">
            <a  href="{% url 'register' %}">Don't have an account? Press to create!</a>
        </div>

    </form>
{% endblock %}
